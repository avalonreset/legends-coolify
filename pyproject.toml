[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-coolify"
version = "0.2.1"
description = "A source-cited Coolify knowledge vault and read-only operational checks for agents."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Benjamin Samar / cto-legends"}]
dependencies = []
readme = "README.md"

[project.scripts]
legends-coolify = "legends_coolify.cli:main"

[project.urls]
Repository = "https://github.com/avalonreset/legends-coolify"
Issues = "https://github.com/avalonreset/legends-coolify/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["legends_coolify*"]
