name: checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Release gate
        run: python scripts/check_release.py --root .
      - name: Install test tooling
        run: python -m pip install setuptools
      - name: Test suite
        run: python -m unittest discover -s tests -v
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Clean install outside checkout
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Installed wheel mirror tests
        run: python tests/test_packaging.py WheelSmoke -v
      - name: Packaged CLI smoke outside checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          legends-coolify --version
          legends-coolify doctor
          legends-coolify resources > resources.json
          python - <<'EOF'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          info = json.load(open("resources.json"))
          assert info["source"] == "package_data", info["source"]
          root = Path(info["root"])
          assert root.is_absolute(), info["root"]
          recipe = Path(info["recipe"])
          if not recipe.is_absolute():
              recipe = root / recipe
          assert recipe.is_file(), str(recipe)
          assert recipe.name == "AGENT-RECIPE.md", recipe.name
          pack_dir = Path(info["pack_dir"])
          assert pack_dir.is_absolute(), info["pack_dir"]
          if info.get("pack_manifest"):
              pack_manifest = Path(info["pack_manifest"])
          else:
              pack_manifest = pack_dir / "coolify" / "pack.json"
          assert pack_manifest.is_file(), str(pack_manifest)
          pack = json.loads(pack_manifest.read_text(encoding="utf-8"))
          assert pack["schema"] == "legends.knowledge-pack/v1", pack.get("schema")
          pack_files = {os.path.normcase(os.path.abspath(p)) for p in info["pack_files"]}
          assert os.path.normcase(os.path.abspath(pack_manifest)) in pack_files, "manifest missing from pack_files"
          ok = 0
          for item in pack["files"]:
              target = pack_manifest.parent / "vault" / item["path"]
              assert os.path.normcase(os.path.abspath(target)) in pack_files, item["path"]
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              assert digest == item["sha256"], item["path"]
              ok += 1
          from importlib import metadata as importlib_metadata
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(workspace / "tests"))
          import test_packaging
          dist = importlib_metadata.distribution("legends-coolify")
          names = {str(entry).replace("\\", "/") for entry in (dist.files or [])}
          missing = [name for name in test_packaging.REQUIRED_DATA if name not in names]
          assert missing == [], f"installed wheel missing data: {missing}"
          mirror_errors = test_packaging.check_installed(root)
          assert mirror_errors == [], f"installed mirror link errors: {mirror_errors[:5]}"
          print(f"resource smoke OK: packaged CLI, recipe, {ok}/{len(pack['files'])} pack hashes, "
                f"mirror docs and links clean")
          EOF

  empire-attachment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and install Coolify wheel
        shell: bash
        run: |
          set -e
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Check out pinned Empire engine
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: avalonreset/legends-empire
          # Immutable legends-empire 0.3.1 transaction engine.
          ref: dac252a647cbe8b42285317fe096e20afaf2fbe9
          path: .integration/empire
      - name: Attach packaged knowledge on the native OS
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          legends-coolify resources > resources.json
          python - <<'EOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          info = json.load(open("resources.json"))
          assert info["source"] == "package_data", info["source"]
          if info.get("pack_manifest"):
              pack = info["pack_manifest"]
          else:
              pack = str(Path(info["pack_dir"]) / "coolify" / "pack.json")
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          subprocess.run([
              sys.executable,
              str(workspace / "scripts" / "verify_knowledge_attachment.py"),
              "--empire-source", str(workspace / ".integration" / "empire"),
              "--pack", pack,
          ], check=True)
          EOF
